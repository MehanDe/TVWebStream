plugins {
    id 'com.android.application'
}

// Set automatically by GitHub Actions; defaults are for local builds.
def repoSlug = System.getenv('GITHUB_REPOSITORY') ?: ''
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.emon.tvstream'
    compileSdk 34

    defaultConfig {
        applicationId "com.emon.tvstream"
        minSdk 22
        targetSdk 34
        versionCode buildNumber
        versionName "1.${buildNumber}"
        buildConfigField "String", "REPO", "\"${repoSlug}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Same key on every build, so new versions can install over old ones.
    signingConfigs {
        stable {
            storeFile file('stable.keystore')
            storePassword 'tvstream123'
            keyAlias 'tvstream'
            keyPassword 'tvstream123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
